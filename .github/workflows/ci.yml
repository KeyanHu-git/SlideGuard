name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-target
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - run: node --version
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo +1.98.1 fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo +1.98.1 test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - run: cargo +1.98.1 build --locked --release --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol

  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[qa,dev]"
      - run: python scripts/audit_zero_egress.py
      - run: python -m pytest -q tests
      - run: python scripts/interruption_matrix.py --output .test-results/interruption-matrix.json
      - uses: actions/upload-artifact@v6
        with:
          name: interruption-matrix-py${{ matrix.python-version }}
          path: .test-results/interruption-matrix.json
          if-no-files-found: error
