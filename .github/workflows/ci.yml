name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[qa,dev]"
      - run: python scripts/audit_zero_egress.py
      - run: python -m pytest -q tests
      - run: python scripts/interruption_matrix.py --output .test-results/interruption-matrix.json
      - uses: actions/upload-artifact@v6
        with:
          name: interruption-matrix-py${{ matrix.python-version }}
          path: .test-results/interruption-matrix.json
          if-no-files-found: error
