[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slideguard"
version = "0.1.0"
description = "Provable high-fidelity PowerPoint figure export for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keyan Hu" }]
dependencies = [
  "lxml>=5.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pypdf>=5.0",
  "CairoSVG>=2.7",
]

[project.optional-dependencies]
qa = ["scikit-image>=0.22"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
slideguard = "slideguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
slideguard = ["resources/*.ps1", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
